[package]
name = "laya"
version = "0.1.2"
edition = "2024"
description = "Typed local Laya inference on Burn with a Python fine-tuning pipeline"
license = "GPL-3.0-only"
repository = "https://github.com/ParkSnoopy/laya-rs"
readme = "README.md"
keywords = ["machine-learning", "inference", "burn", "laya"]
categories = ["science"]

[[bin]]
name = "laya"
path = "src/inference/main.rs"

[features]
# CubeCL disables branches defaults; its std path avoids obsolete nightly intrinsics.
vulkan = ["burn/vulkan", "dep:branches"]

[dependencies]
anyhow = "1"
branches = { version = "0.4", default-features = false, features = ["std"], optional = true }
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
burn-store = { version = "0.22", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[build-dependencies]
burn-onnx = "0.22"

# Flex executes tensor kernels in Rust, including during parity tests.
[profile.test]
opt-level = 3

# ============================================
# RUST-MAGIC-LINTER (maximum preset)
# https://github.com/vicnaum/rust-magic-linter
# ============================================
# ============================================
# MAXIMUM PRESET
# ============================================
# Everything at deny level - Tenex-style maximum strictness
# Use this for critical infrastructure or when you want maximum safety
#
# WARNING: This is very strict and may require significant code changes

[lints.rust]
# Safety - forbid means even #![allow(...)] can't override
unsafe_code = "forbid"
non_ascii_idents = "forbid"

# Quality enforcement
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

# Documentation enforcement
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
# === ALL LINT GROUPS AT DENY ===
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# === THE GUARDRAILS ===
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Code hygiene
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# === ASYNC SAFETY ===
await_holding_lock = "deny"
large_futures = "deny"

# === PROCESS/MEMORY SAFETY ===
exit = "deny"
mem_forget = "deny"

# === PERFORMANCE ===
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"

# === MINIMAL RELAXATIONS ===
# Only the absolutely necessary ones
multiple_crate_versions = "allow"   # Unavoidable with transitive deps

# Cast lints - too many false positives even for strict projects
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# Nursery lints that have too many false positives
cognitive_complexity = "allow"      # Use clippy.toml threshold instead
